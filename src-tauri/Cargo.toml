[package]
name = "mlightcad-studio"
version = "1.7.8"
description = "Desktop edition of MLightCAD, a browser-engine based DWG/DXF viewer and editor."
authors = ["MLightCAD"]
license = "MIT"
repository = "https://github.com/mlightcad/mlightcad-studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mlightcad_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
